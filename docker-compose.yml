version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: skillswap_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: skillswap
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Qdrant Vector DB ────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: skillswap_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # ── Neo4j Knowledge Graph ───────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: skillswap_neo4j
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"  # Browser UI
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data

  # ── Redis Cache / Memory ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: skillswap_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  # ── Node.js Backend ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillswap_backend
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/skillswap
      JWT_SECRET: super_secret_jwt_signature_key_2026
      FRONTEND_URL: http://localhost:5173
      AGENT_SERVICE_URL: http://agents:8000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  # ── Python AI Agent Microservice ────────────────────────
  agents:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: skillswap_agents
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      LLM_PROVIDER: groq
      DATABASE_URL: postgresql://postgres:password@postgres:5432/skillswap
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: skillswap_embeddings
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      REDIS_URL: redis://redis:6379
      BACKEND_URL: http://backend:5000
      AGENTS_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - qdrant
      - neo4j
      - redis
    volumes:
      - ./agents:/app

  # ── Vite Frontend ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skillswap_frontend
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    stdin_open: true
    tty: true
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  redis_data:
