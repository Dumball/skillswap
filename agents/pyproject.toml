[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-swap-agents"
version = "0.1.0"
description = "AI Agents for Skill Swap platform - Groq API powered"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "python-dotenv==1.0.1",
    "pydantic==2.10.4",
    "aiohttp==3.11.11",
    "httpx==0.28.1",
    "requests==2.31.0",
    "slowapi==0.1.9",
    "gunicorn==23.0.0",
    "uvloop==0.21.0"
]

[tool.setuptools.packages.find]
where = ["."]